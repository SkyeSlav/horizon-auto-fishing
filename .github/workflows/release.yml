name: Release
# Builds the release file from source and attaches it to the release
# for the tag. Since 1.0.0 the release ships the .hmod only (the .hnmod
# for Starling 0.8.0 was discontinued):
# - the .hmod (Horizon launcher) is built with
#   cargo-horizon-mod against the SDK the manifest pins.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the build to"
        required: true
        default: "v1.0.3"
  push:
    tags: ["v*"]

jobs:
  build-hmod:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      # Pinned to the tool revision this release was built and checked
      # with, so a later tool change cannot silently change the package.
      - run: cargo install --locked --git https://github.com/horizon-rust/horizon --rev 5a5aca6b21c7d8af9f7890a43a835cc06e4c21bf cargo-horizon-mod
      # The build fetches the pinned SDK into hmod/.horizon/sdk/ itself.
      - run: cd hmod && cargo horizon-mod build
      - run: cd hmod && cargo horizon-mod check target/horizon-mod/auto_fishing.hmod
      # The tool names its output after the mod id; the release names it
      # with the version.
      - run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          mv hmod/target/horizon-mod/auto_fishing.hmod "hmod/target/horizon-mod/auto-fishing-${tag#v}.hmod"
      - run: cd hmod && cargo test -- --test-threads=1
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body: |
            1.0.3 ships the MIT LICENSE file inside the `.hmod`, fixes the version mismatch (Cargo.toml said 0.1.0), and rewrites the description to say plainly that it automates fishing input — many servers forbid AFK/automated fishing, so check the rules first. Bite detection is unchanged from 1.0.2 (checked against the cast itself).

            Horizon launcher users: take `auto-fishing-1.0.3.hmod`. The `.hnmod` asset on 1.0.0 is the old Starling 0.8.0 build, discontinued.
          files: hmod/target/horizon-mod/*.hmod
