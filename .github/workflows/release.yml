name: Release
# Builds the release file from source and attaches it to the release
# for the tag. Since 1.0.0 the release ships the .hmod only (the .hnmod
# for Starling 0.8.0 was discontinued):
# - the .hmod (Horizon launcher) is built with
#   cargo-horizon-mod against the SDK the manifest pins.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the build to"
        required: true
        default: "v1.0.5"
  push:
    tags: ["v*"]

jobs:
  build-hmod:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      # Pinned to the tool revision this release was built and checked
      # with, so a later tool change cannot silently change the package.
      - run: cargo install --locked --git https://github.com/horizon-rust/horizon --rev 5a5aca6b21c7d8af9f7890a43a835cc06e4c21bf cargo-horizon-mod
      # The build fetches the pinned SDK into hmod/.horizon/sdk/ itself.
      - run: cd hmod && cargo horizon-mod build
      - run: cd hmod && cargo horizon-mod check target/horizon-mod/auto_fishing.hmod
      # The tool names its output after the mod id; the release names it
      # with the version.
      - run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          mv hmod/target/horizon-mod/auto_fishing.hmod "hmod/target/horizon-mod/auto-fishing-${tag#v}.hmod"
      - run: cd hmod && cargo test -- --test-threads=1
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body: |
            1.0.5: fixes the mode migration 1.0.4 shipped with. The mode now lives under a new key, and the first load after updating migrates a mode saved by 1.0.3 to it — all four values (1–4) keep the mode they had, before any automation runs. The old 1–4 slider stays on the settings page beside the named choice, and the two stay in sync: moving either one updates the other. Bite detection is unchanged (checked against the cast itself).

            Note: a value stored by 1.0.4 (a choice index under the old key) cannot be told apart from a 1.0.3 slider value, so if you installed 1.0.4 from GitHub, check the mode name on the `/autofish` status line once after updating.

            Horizon launcher users: take `auto-fishing-1.0.5.hmod`. The `.hnmod` asset on 1.0.0 is the old Starling 0.8.0 build, discontinued.
          files: hmod/target/horizon-mod/*.hmod
