# Supplies name, summary, description, authors and license for the
# registry entry (other keys are refused). Lives at the repo root in the
# newest release tag.
name = "Horizon Auto Fishing"
summary = "Reels in when a fish bites and casts again, with break protection, inventory rod swapping and human-like delays."
description = """Horizon Auto Fishing watches the bobber on a server and reels in on the bite, then casts again after the recast delay (default 17 ticks). You cast first by hand — the mod never casts on its own — and it takes over from there.

Break protection keeps a rod from being used once 5 or fewer durability remain, and the all-rods modes swap a worn-out rod for the freshest rod in your hotbar or inventory. Delays get a small random extra so no two cycles are exactly alike, and an opt-in junk filter throws away only the items you list."""
authors = ["SkyeSlav"]
license = "MIT"
